name: Build D008 Audit DOCX

on:
  push:
    branches:
      - feature/sh3673510-d013-bmsdvc
    paths:
      - .github/workflows/build-d008-audit-docx.yml

permissions:
  contents: write

jobs:
  build-docx:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Assemble audit markdown
        run: |
          cat \
            docs/audit/HS-D008_DVC1124_D013_Framework_Audit_Part1.md \
            docs/audit/HS-D008_DVC1124_D013_Framework_Audit_Part2.md \
            docs/audit/HS-D008_DVC1124_D013_Framework_Audit_Part3.md \
            docs/audit/HS-D008_DVC1124_D013_Framework_Audit_Part4.md \
            > /tmp/d008-audit.md
          # The repository keeps the report text self-contained. The original
          # schematic crop is intentionally not duplicated as a binary asset.
          sed -i '/assets\/d008_dvc_crop.png/d' /tmp/d008-audit.md

      - name: Build DOCX
        run: |
          pandoc /tmp/d008-audit.md \
            --from=gfm \
            --toc \
            --metadata title="HS-D008 / DVC1124 对齐 D013 框架与寄存器配置审计" \
            -o docs/HS-D008_DVC1124_D013_Framework_Audit_2026-09-14.docx

      - name: Commit generated DOCX
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/HS-D008_DVC1124_D013_Framework_Audit_2026-09-14.docx
          if git diff --cached --quiet; then
            echo "DOCX unchanged"
            exit 0
          fi
          git commit -m "docs(d008): add generated DVC/D013 audit DOCX"
          git push origin HEAD:feature/sh3673510-d013-bmsdvc
