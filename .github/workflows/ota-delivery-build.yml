name: OTA Delivery Build

on:
  push:
    branches:
      - build/ota-delivery-20260901
    paths:
      - 'ota-build/**'
      - '.github/workflows/ota-delivery-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 delivery
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source bundle and apply fast OTA patches
        shell: pwsh
        run: |
          $parts = Get-ChildItem 'ota-build/src.part*' | Sort-Object Name
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes('BmsOtaSuite.zip', [Convert]::FromBase64String($b64))
          Expand-Archive -Path BmsOtaSuite.zip -DestinationPath src -Force
          Copy-Item ota-build/patches/WindowsBleTransport.cs src/BmsOtaSuite/Windows/Bms.Ota.Windows/Ble/WindowsBleTransport.cs -Force
          Copy-Item ota-build/patches/MainWindow.xaml src/BmsOtaSuite/Windows/Bms.Ota.Windows/MainWindow.xaml -Force
          Copy-Item ota-build/patches/MainWindow.xaml.cs src/BmsOtaSuite/Windows/Bms.Ota.Windows/MainWindow.xaml.cs -Force
          Copy-Item ota-build/patches/IOtaTransport.cs src/BmsOtaSuite/Windows/Bms.Ota.Core/Transport/IOtaTransport.cs -Force
          Copy-Item ota-build/patches/TelinkOtaClient.cs src/BmsOtaSuite/Windows/Bms.Ota.Core/Telink/TelinkOtaClient.cs -Force
          Copy-Item ota-build/patches/OtaProgress.cs src/BmsOtaSuite/Windows/Bms.Ota.Core/Telink/OtaProgress.cs -Force
          Copy-Item ota-build/patches/OtaTransferMode.cs src/BmsOtaSuite/Windows/Bms.Ota.Core/Telink/OtaTransferMode.cs -Force
          Copy-Item ota-build/patches/OtaResult.cs src/BmsOtaSuite/Windows/Bms.Ota.Core/Telink/OtaResult.cs -Force
          Copy-Item ota-build/patches/ExtendedPacketBuilder.cs src/BmsOtaSuite/Windows/Bms.Ota.Core/Telink/ExtendedPacketBuilder.cs -Force
          Copy-Item ota-build/patches/Program.cs src/BmsOtaSuite/Windows/Bms.Ota.Core.SmokeTest/Program.cs -Force

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        shell: pwsh
        working-directory: src/BmsOtaSuite/Windows
        run: dotnet restore BmsOtaSuite.sln

      - name: Protocol smoke test
        shell: pwsh
        working-directory: src/BmsOtaSuite/Windows
        run: dotnet run --project Bms.Ota.Core.SmokeTest/Bms.Ota.Core.SmokeTest.csproj -c Release

      - name: Build Release
        shell: pwsh
        working-directory: src/BmsOtaSuite/Windows
        run: dotnet build BmsOtaSuite.sln -c Release --no-restore

      - name: Publish self-contained win-x64
        shell: pwsh
        working-directory: src/BmsOtaSuite/Windows
        run: |
          dotnet publish Bms.Ota.Windows/Bms.Ota.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o $env:GITHUB_WORKSPACE/dist/windows
          if (-not (Test-Path "$env:GITHUB_WORKSPACE/dist/windows/Bms.Ota.Windows.exe")) { throw 'Windows EXE not produced' }

      - name: Build info
        shell: pwsh
        run: |
          @"
          GitCommit=$env:GITHUB_SHA
          BuildUtc=$(Get-Date -AsUTC -Format o)
          Runner=windows-latest
          Dotnet=$(dotnet --version)
          Target=net8.0-windows10.0.19041.0
          RID=win-x64
          Configuration=Release
          TelinkOtaServiceUuid=00010203-0405-0607-0809-0a0b0c0d1912
          TelinkOtaCharacteristicUuid=00010203-0405-0607-0809-0a0b0c0d2b12
          OtaGattDiscovery=automatic
          DefaultPacketDelayMs=0
          ProgressUiMaxHz=10
          TransferModes=Auto,LegacyFast,Extend64
          Extend64MinAttMtu=71
          "@ | Set-Content dist/windows/BUILD_INFO.txt
          Compress-Archive -Path dist/windows/* -DestinationPath dist/BmsOta-Windows-x64.zip -Force
          Get-FileHash dist/BmsOta-Windows-x64.zip -Algorithm SHA256 | Format-List | Out-File dist/BmsOta-Windows-x64.sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: BmsOta-Windows-x64
          path: |
            dist/windows/**
            dist/BmsOta-Windows-x64.zip
            dist/BmsOta-Windows-x64.sha256.txt
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android APK delivery
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source bundle and apply automatic OTA discovery patches
        shell: bash
        run: |
          cat ota-build/src.part* | base64 -d > BmsOtaSuite.zip
          unzip -q BmsOtaSuite.zip -d src
          cp ota-build/patches/BleOtaSession.kt src/BmsOtaSuite/Android/BmsOtaAndroid/app/src/main/java/com/example/bmsota/ble/BleOtaSession.kt
          cp ota-build/patches/MainActivity.kt src/BmsOtaSuite/Android/BmsOtaAndroid/app/src/main/java/com/example/bmsota/MainActivity.kt
          cp ota-build/patches/activity_main.xml src/BmsOtaSuite/Android/BmsOtaAndroid/app/src/main/res/layout/activity_main.xml
          cp ota-build/patches/AndroidManifest.xml src/BmsOtaSuite/Android/BmsOtaAndroid/app/src/main/AndroidManifest.xml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0' || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APKs first
        shell: bash
        working-directory: src/BmsOtaSuite/Android/BmsOtaAndroid
        run: gradle --no-daemon clean test assembleDebug assembleRelease

      - name: Collect APKs
        shell: bash
        run: |
          mkdir -p dist/android
          cp src/BmsOtaSuite/Android/BmsOtaAndroid/app/build/outputs/apk/debug/app-debug.apk dist/android/BmsOta-debug.apk
          cp src/BmsOtaSuite/Android/BmsOtaAndroid/app/build/outputs/apk/release/app-release-unsigned.apk dist/android/BmsOta-release-unsigned.apk
          sha256sum dist/android/*.apk | tee dist/android/SHA256SUMS.txt
          {
            echo "GitCommit=$GITHUB_SHA"
            echo "BuildUtc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Runner=ubuntu-latest"
            echo "Java=$(java -version 2>&1 | head -1)"
            echo "Gradle=$(gradle --version | awk '/Gradle /{print $2; exit}')"
            echo "AGP=8.7.3"
            echo "Kotlin=2.0.21"
            echo "compileSdk=35"
            echo "targetSdk=35"
            echo "minSdk=26"
            echo "TelinkOtaServiceUuid=00010203-0405-0607-0809-0a0b0c0d1912"
            echo "TelinkOtaCharacteristicUuid=00010203-0405-0607-0809-0a0b0c0d2b12"
            echo "OtaGattDiscovery=automatic"
          } > dist/android/BUILD_INFO.txt
          (cd dist && zip -qr BmsOta-Android.zip android)

      - name: Upload APK delivery before validation
        uses: actions/upload-artifact@v4
        with:
          name: BmsOta-Android
          path: |
            dist/android/**
            dist/BmsOta-Android.zip
          if-no-files-found: error
          retention-days: 7

      - name: Validate Android lint after delivery
        shell: bash
        working-directory: src/BmsOtaSuite/Android/BmsOtaAndroid
        run: gradle --no-daemon lint
