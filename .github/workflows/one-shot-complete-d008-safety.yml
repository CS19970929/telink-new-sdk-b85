name: One-shot complete D008 safety framework

on:
  push:
    branches:
      - refactor/d008-afe-hw-protection-split
    paths:
      - .github/workflows/one-shot-complete-d008-safety.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix open-wire public result array declaration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tc_ble_single_sdk-V3.4.2.8_Patch_0001/tc_ble_single_sdk/vendor/ble_sample/dvc1124.h')
          s = p.read_text(encoding='utf-8')
          old = '    uint16_t cell_mv[DVC1124_MAX_CELLS];\n'
          new = '    uint16_t cell_mv[24]; /* DVC1124 physical maximum; macro is declared below this public type. */\n'
          if old not in s:
              raise SystemExit('open-wire result array anchor not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Run D008 host contracts
        run: |
          python bms_tools/bms.py sources --check
          python tests/afe_hw_profile_contract_check.py
          python tests/afe_hw_access_contract_check.py
          python tests/dvc1124_config_quick_check.py
          python tests/d008_framework_contract_check.py
          python tests/d008_20s_profile_contract_check.py
          python tests/sw_protection_contract_check.py
          python tests/soc_contract_check.py
          python tests/flash_quick_check.py
      - name: Commit header fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tc_ble_single_sdk-V3.4.2.8_Patch_0001/tc_ble_single_sdk/vendor/ble_sample/dvc1124.h
          git commit -m "fix(d008): compile open-wire result with TC32"
          git push origin HEAD:${GITHUB_REF_NAME}
