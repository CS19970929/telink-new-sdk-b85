name: SOC Module Refactor

on:
  push:
    branches:
      - feature/sh3673510-d011-bms

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply SOC refactor
        run: python tools/refactor_soc_module.py

      - name: Run SOC contract
        run: python tests/soc_contract_check.py

      - name: Run flash/source contracts
        run: python tests/flash_quick_check.py

      - name: Run D011 integration contract
        run: python tests/sh3673510_d011_integration_check.py

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 0
          git commit -m "feat: complete dual-chemistry SOC module"
          git push origin HEAD:feature/sh3673510-d011-bms
