name: D011 hardware OCD latch one-shot fix

on:
  push:
    branches:
      - feature/sh3673510-d011-bms
    paths:
      - .github/workflows/d011-ocd-latch-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/sh3673510-d011-bms
          fetch-depth: 0

      - name: Patch hardware OCD recovery and reporting
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('tc_ble_single_sdk-V3.4.2.8_Patch_0001/tc_ble_single_sdk/vendor/ble_sample')
          bms_path = root / 'sh3673510_bms.c'
          bms = bms_path.read_text(encoding='utf-8', errors='ignore')

          old = '#define SH3510_SHORT_RELEASE_SAMPLES    10u /* 2 s stable LOADOFF at 200 ms */\n'
          new = old + '#define SH3510_OCD_RELEASE_FILTER_10MS  200u /* 2 s stable load-off/charge recovery */\n'
          if old not in bms or 'SH3510_OCD_RELEASE_FILTER_10MS' in bms:
              raise SystemExit('OCD release macro anchor unexpected')
          bms = bms.replace(old, new, 1)

          anchor = '''static void service_short_recovery(const sh3673510_control_status_t *s)\n{'''
          merge = '''static void merge_hw_protection_faults(const sh3673510_control_status_t *s)\n{\n    union MDLCHGFAULT_REG *f;\n    if (s == 0) return;\n\n    /* Hardware protection may act before the 200 ms software sample sees the\n     * violating value. Mirror the latched AFE protection into the Third-level\n     * report so the host never shows "no protection" while a MOS is blocked. */\n    f = &g_stCellInfoReport.unMdlFault_Third;\n    if (s->flag1 & SH3673520_FLAG1_OV_MASK) f->bits.b1CellOvp = 1u;\n    if (s->flag1 & SH3673520_FLAG1_UV_MASK) f->bits.b1CellUvp = 1u;\n    if (s->flag1 & SH3673520_FLAG1_OCC_MASK) f->bits.b1IchgOcp = 1u;\n    if (s->flag1 & (SH3673520_FLAG1_OCD1_MASK | SH3673520_FLAG1_OCD2_MASK))\n        f->bits.b1IdischgOcp = 1u;\n    if (s->flag2 & SH3673520_FLAG2_OTC_MASK) f->bits.b1CellChgOtp = 1u;\n    if (s->flag2 & SH3673520_FLAG2_UTC_MASK) f->bits.b1CellChgUtp = 1u;\n    if (s->flag2 & SH3673520_FLAG2_OTD_MASK) f->bits.b1CellDischgOtp = 1u;\n    if (s->flag2 & SH3673520_FLAG2_UTD_MASK) f->bits.b1CellDischgUtp = 1u;\n}\n\n'''
          if anchor not in bms or 'merge_hw_protection_faults' in bms:
              raise SystemExit('hardware protection reporting anchor unexpected')
          bms = bms.replace(anchor, merge + anchor, 1)

          old = '''    uint16_t bat_min = 0u, bat_max = 0u;\n    uint8_t bat_temp_ok;\n    if (s == 0) return;\n\n    actual_ok = sh3673510_control_get_protection_actual(&actual);\n'''
          new = '''    uint16_t bat_min = 0u, bat_max = 0u;\n    uint8_t bat_temp_ok;\n    uint8_t dsg_ocp_release_ok;\n    if (s == 0) return;\n\n    actual_ok = sh3673510_control_get_protection_actual(&actual);\n    /* Current naturally becomes zero after OCD turns DSG off, so current alone\n     * is not proof that the external overload disappeared. Require either\n     * stable LOADOFF or a real charge-direction state before clearing OCD. */\n    dsg_ocp_release_ok = (uint8_t)(((s->bstatus2 & SH3673520_BSTATUS2_LOADOFF_MASK) ||\n                                    (s->bstatus2 & SH3673520_BSTATUS2_CHGING_MASK)) ? 1u : 0u);\n'''
          if old not in bms:
              raise SystemExit('hardware recovery local-variable anchor not found')
          bms = bms.replace(old, new, 1)

          old1 = '''        if (hw_recovery_stable(HW_REC_OCD1,\n                actual_ok &&\n                g_stCellInfoReport.u16IDischg <= g_tParam.protect.u16IdsgOcp_Rcv &&\n                g_stCellInfoReport.u16IDischg < actual.ocd1_a10,\n                g_tParam.protect.u16IdsgOcp_Filter)) c1 |= SH3673520_FLAG1_OCD1_MASK;\n'''
          new1 = '''        if (hw_recovery_stable(HW_REC_OCD1,\n                actual_ok && dsg_ocp_release_ok &&\n                g_stCellInfoReport.u16IDischg <= g_tParam.protect.u16IdsgOcp_Rcv &&\n                g_stCellInfoReport.u16IDischg < actual.ocd1_a10,\n                SH3510_OCD_RELEASE_FILTER_10MS)) c1 |= SH3673520_FLAG1_OCD1_MASK;\n'''
          if old1 not in bms:
              raise SystemExit('OCD1 recovery pattern not found')
          bms = bms.replace(old1, new1, 1)

          old2 = '''        if (hw_recovery_stable(HW_REC_OCD2,\n                actual_ok &&\n                g_stCellInfoReport.u16IDischg <= g_tParam.protect.u16IdsgOcp_Rcv &&\n                g_stCellInfoReport.u16IDischg < actual.ocd2_a10,\n                g_tParam.protect.u16IdsgOcp_Filter)) c1 |= SH3673520_FLAG1_OCD2_MASK;\n'''
          new2 = '''        if (hw_recovery_stable(HW_REC_OCD2,\n                actual_ok && dsg_ocp_release_ok &&\n                g_stCellInfoReport.u16IDischg <= g_tParam.protect.u16IdsgOcp_Rcv &&\n                g_stCellInfoReport.u16IDischg < actual.ocd2_a10,\n                SH3510_OCD_RELEASE_FILTER_10MS)) c1 |= SH3673520_FLAG1_OCD2_MASK;\n'''
          if old2 not in bms:
              raise SystemExit('OCD2 recovery pattern not found')
          bms = bms.replace(old2, new2, 1)

          old = '''        update_faults();\n        service_short_recovery(&status);\n        service_hw_flag_recovery(&status);\n'''
          new = '''        update_faults();\n        merge_hw_protection_faults(&status);\n        service_short_recovery(&status);\n        service_hw_flag_recovery(&status);\n'''
          if old not in bms:
              raise SystemExit('measurement fault merge anchor not found')
          bms = bms.replace(old, new, 1)
          bms_path.write_text(bms, encoding='utf-8')

          test_path = Path('tests/sh3673510_d011_integration_check.py')
          test = test_path.read_text(encoding='utf-8')
          anchor = 'require(bms, "service_hw_flag_recovery")\nrequire(bms, "hw_recovery_stable")\n'
          addition = anchor + '''require(bms, "merge_hw_protection_faults")\nrequire(bms, "SH3510_OCD_RELEASE_FILTER_10MS")\nrequire(bms, "SH3673520_BSTATUS2_LOADOFF_MASK")\nrequire(bms, "SH3673520_BSTATUS2_CHGING_MASK")\n'''
          if anchor not in test or 'merge_hw_protection_faults' in test:
              raise SystemExit('integration contract insertion anchor unexpected')
          test = test.replace(anchor, addition, 1)

          old = '''    "u16IDischg <= g_tParam.protect.u16IdsgOcp_Rcv",\n    "u16IDischg < actual.ocd1_a10",\n    "u16IDischg < actual.ocd2_a10",\n'''
          new = '''    "dsg_ocp_release_ok",\n    "SH3673520_BSTATUS2_LOADOFF_MASK",\n    "SH3673520_BSTATUS2_CHGING_MASK",\n    "u16IDischg <= g_tParam.protect.u16IdsgOcp_Rcv",\n    "u16IDischg < actual.ocd1_a10",\n    "u16IDischg < actual.ocd2_a10",\n    "SH3510_OCD_RELEASE_FILTER_10MS",\n'''
          if old not in test:
              raise SystemExit('hardware recovery contract list anchor not found')
          test = test.replace(old, new, 1)
          test_path.write_text(test, encoding='utf-8')
          PY

          python3 tests/sh3673510_d011_integration_check.py
          python3 tests/sh3673520_contract_check.py

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/d011-ocd-latch-fix.yml
          git add tc_ble_single_sdk-V3.4.2.8_Patch_0001/tc_ble_single_sdk/vendor/ble_sample/sh3673510_bms.c
          git add tests/sh3673510_d011_integration_check.py
          git commit -m 'fix: latch D011 hardware OCD until valid recovery'
          git push origin HEAD:feature/sh3673510-d011-bms
