name: SOC Full Anchor Fix

on:
  push:
    branches:
      - feature/sh3673510-d011-bms

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply full-anchor rule
        run: python tools/fix_soc_full_anchor.py

      - name: Run SOC contract
        run: python tests/soc_contract_check.py

      - name: Run flash/source contracts
        run: python tests/flash_quick_check.py

      - name: Run D011 integration contract
        run: python tests/sh3673510_d011_integration_check.py

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SOC.md tests/soc_contract_check.py tc_ble_single_sdk-V3.4.2.8_Patch_0001/tc_ble_single_sdk/vendor/ble_sample/SocEnhance.c
          git diff --cached --exit-code && exit 0
          git commit -m "fix: require charging for SOC full anchor"
          git push origin HEAD:feature/sh3673510-d011-bms
