name: D008 AFE HW split CI

on:
  push:
    branches:
      - refactor/d008-afe-hw-protection-split
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d008-afe-hw-split-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python bms_tools/bms.py sources --check
      - run: python tests/afe_hw_profile_contract_check.py
      - run: python tests/afe_hw_access_contract_check.py
      - run: python tests/dvc1124_config_quick_check.py
      - run: python tests/d008_framework_contract_check.py
      - run: python tests/d008_20s_profile_contract_check.py
      - run: python tests/sw_protection_contract_check.py
      - run: python tests/soc_contract_check.py
      - run: python tests/flash_quick_check.py

  tc32:
    if: ${{ vars.TELINK_TC32_CI_ENABLED == '1' }}
    runs-on: [self-hosted, Windows, X64, telink-tc32]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check environment
        shell: powershell
        run: python bms_tools/bms.py env
      - name: Validate source order
        shell: powershell
        run: python bms_tools/bms.py sources --check
      - name: AFE split contracts
        shell: powershell
        run: |
          python tests/afe_hw_profile_contract_check.py
          python tests/afe_hw_access_contract_check.py
          python tests/dvc1124_config_quick_check.py
          python tests/d008_framework_contract_check.py
          python tests/d008_20s_profile_contract_check.py
          python tests/sw_protection_contract_check.py
      - name: Clean rebuild 24S LFP default
        shell: powershell
        run: python bms_tools/bms.py rebuild --jobs 4
      - name: Check firmware
        shell: powershell
        run: python bms_tools/bms.py check-fw
      - name: Size
        shell: powershell
        run: python bms_tools/bms.py size
      - name: MAP
        shell: powershell
        run: python bms_tools/bms.py map
      - name: Manifest
        shell: powershell
        run: python bms_tools/bms.py manifest
      - name: Verify
        shell: powershell
        run: python bms_tools/bms.py verify
      - name: cppcheck
        shell: powershell
        run: python bms_tools/bms.py static --no-report
      - name: Remaining contracts
        shell: powershell
        run: |
          python tests/soc_contract_check.py
          python tests/flash_quick_check.py
      - name: Upload 24S LFP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d008-afe-hw-split-24s-lfp-${{ github.sha }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            tc_ble_single_sdk-V3.4.2.8_Patch_0001/tc_ble_single_sdk/project/tlsr_tc32/B85/825x_ble_sample_cli/825x_ble_sample.bin
            tc_ble_single_sdk-V3.4.2.8_Patch_0001/tc_ble_single_sdk/project/tlsr_tc32/B85/825x_ble_sample_cli/825x_ble_sample.elf
            tc_ble_single_sdk-V3.4.2.8_Patch_0001/tc_ble_single_sdk/project/tlsr_tc32/B85/825x_ble_sample_cli/fw_manifest.json
            tc_ble_single_sdk-V3.4.2.8_Patch_0001/tc_ble_single_sdk/project/tlsr_tc32/B85/825x_ble_sample_cli/gen/825x_ble_sample.map
            tc_ble_single_sdk-V3.4.2.8_Patch_0001/tc_ble_single_sdk/project/tlsr_tc32/B85/825x_ble_sample_cli/static/**
      - name: Clean rebuild 20S NMC variant
        shell: powershell
        run: |
          python -c "from pathlib import Path; p=Path(r'tc_ble_single_sdk-V3.4.2.8_Patch_0001/tc_ble_single_sdk/vendor/ble_sample/d008_product_profile.h'); s=p.read_text(encoding='utf-8'); old='#define D008_PRODUCT_PROFILE D008_PRODUCT_PROFILE_24S_LFP'; new='#define D008_PRODUCT_PROFILE D008_PRODUCT_PROFILE_20S_NMC'; assert old in s; p.write_text(s.replace(old,new,1),encoding='utf-8')"
          python bms_tools/bms.py rebuild --jobs 4
          python bms_tools/bms.py check-fw
          python bms_tools/bms.py size
          git diff -- tc_ble_single_sdk-V3.4.2.8_Patch_0001/tc_ble_single_sdk/vendor/ble_sample/d008_product_profile.h
