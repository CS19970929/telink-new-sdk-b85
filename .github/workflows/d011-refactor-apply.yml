name: Finalize D011 Safety Refactor

on:
  push:
    branches:
      - feature/sh3673510-d011-bms
    paths:
      - tools/finalize_d011_safety_refactor.py
      - .github/workflows/d011-refactor-apply.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feature/sh3673510-d011-bms
          fetch-depth: 0

      - name: Remove retry duplicates and strengthen guards
        run: python tools/finalize_d011_safety_refactor.py

      - name: Run D011 contract checks
        run: |
          python tests/sh3673510_d011_integration_check.py
          python tests/sh3673520_contract_check.py
          python -m py_compile tools/finalize_d011_safety_refactor.py tests/sh3673510_d011_integration_check.py

      - name: Commit finalized source
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: finalize D011 safety refactor"
          git push origin HEAD:feature/sh3673510-d011-bms
