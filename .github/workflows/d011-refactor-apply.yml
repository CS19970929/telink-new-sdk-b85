name: Apply D011 Safety Refactor

on:
  push:
    branches:
      - feature/sh3673510-d011-bms
    paths:
      - tools/pre_d011_safety_refactor.py
      - tools/apply_d011_safety_refactor.py
      - .github/workflows/d011-refactor-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feature/sh3673510-d011-bms
          fetch-depth: 0

      - name: Normalize D011 fuse net
        run: python tools/pre_d011_safety_refactor.py

      - name: Apply deterministic refactor
        run: python tools/apply_d011_safety_refactor.py

      - name: Run D011 contract checks
        run: |
          python tests/sh3673510_d011_integration_check.py
          python tests/sh3673520_contract_check.py
          python -m py_compile tools/pre_d011_safety_refactor.py tools/apply_d011_safety_refactor.py tests/sh3673510_d011_integration_check.py

      - name: Commit refactor
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden D011 AFE protection and GPIO safety"
          git push origin HEAD:feature/sh3673510-d011-bms
