name: D011 common-port MOS one-shot fix

on:
  push:
    branches:
      - feature/sh3673510-d011-bms
    paths:
      - .github/workflows/d011-common-port-mos-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/sh3673510-d011-bms
          fetch-depth: 0

      - name: Patch common-port MOS policy and contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('tc_ble_single_sdk-V3.4.2.8_Patch_0001/tc_ble_single_sdk/vendor/ble_sample')

          app_path = root / 'app.c'
          app = app_path.read_text(encoding='utf-8', errors='ignore')
          old = '''void mos_update(void)\n{\n\t/* D011 has no validated dedicated CHG_IN GPIO.  Preserve the branch's\n\t * effective behavior: CHG is normally requested and protection decides\n\t * whether it may conduct; DSG additionally follows the active-low switch.\n\t * The AFE adapter owns final fail-safe arbitration. */\n\tuint8_t chg_target = 1u;\n\tuint8_t dsg_target = d011_switch_is_on() ? 1u : 0u;\n\n\tg_bms_system_status.bits.b1Status_Cool = 0u;\n\t(void)bms_afe_set_fets(chg_target, dsg_target);\n}\n'''
          new = '''void mos_update(void)\n{\n\t/* D011 is a common-port BMS. In the healthy normal state both back-to-back\n\t * FETs are requested ON. The AFE adapter applies direction-specific\n\t * protection/fail-safe blocking; PA0/SW1 is not a DSG gate. */\n\tuint8_t chg_target = 1u;\n\tuint8_t dsg_target = 1u;\n\n\tg_bms_system_status.bits.b1Status_Cool = 0u;\n\t(void)bms_afe_set_fets(chg_target, dsg_target);\n}\n'''
          if old not in app:
              raise SystemExit('app.c mos_update pattern not found')
          app = app.replace(old, new, 1)
          app_path.write_text(app, encoding='utf-8')

          bms_path = root / 'sh3673510_bms.c'
          bms = bms_path.read_text(encoding='utf-8', errors='ignore')
          old = '''static uint8_t sh3510_apply_requested_fets(void)\n{\n    uint8_t charge_on = 0u;\n    uint8_t discharge_on = 0u;\n    uint8_t key_on;\n\n    if (!sh3673510_control_ready()) return 0u;\n    key_on = gpio_read(D011_SWITCH_PIN) ? 0u : 1u;\n\n    if (s_output_enabled && sh3510_outputs_healthy()) {\n        charge_on = s_requested_charge_on ? 1u : 0u;\n        discharge_on = (s_requested_discharge_on && key_on) ? 1u : 0u;\n        if (charge_blocked()) charge_on = 0u;\n        if (discharge_blocked()) discharge_on = 0u;\n    }\n'''
          new = '''static uint8_t sh3510_apply_requested_fets(void)\n{\n    uint8_t charge_on = 0u;\n    uint8_t discharge_on = 0u;\n\n    if (!sh3673510_control_ready()) return 0u;\n\n    if (s_output_enabled && sh3510_outputs_healthy()) {\n        charge_on = s_requested_charge_on ? 1u : 0u;\n        discharge_on = s_requested_discharge_on ? 1u : 0u;\n        if (charge_blocked()) charge_on = 0u;\n        if (discharge_blocked()) discharge_on = 0u;\n    }\n'''
          if old not in bms:
              raise SystemExit('sh3673510_bms.c FET arbitration pattern not found')
          bms = bms.replace(old, new, 1)
          bms_path.write_text(bms, encoding='utf-8')

          test_path = Path('tests/sh3673510_d011_integration_check.py')
          test = test_path.read_text(encoding='utf-8')
          old = 'bms = text("sh3673510_bms.c")\n'
          new = 'bms = text("sh3673510_bms.c")\napp = text("app.c")\n'
          if old not in test or 'app = text("app.c")' in test:
              raise SystemExit('integration test app binding pattern unexpected')
          test = test.replace(old, new, 1)
          if 'require(bms, "D011_SWITCH_PIN")' not in test:
              raise SystemExit('legacy D011_SWITCH_PIN contract not found')
          test = test.replace('require(bms, "D011_SWITCH_PIN")', 'require(app, "D011_SWITCH_PIN")', 1)

          anchor = '''require(bms, "g_stCellInfoReport.u16Temperature[AFE1_TEMP3]")\nrequire(bms, "g_stCellInfoReport.u16TempMin = bat_temp_min;")\nrequire(bms, "g_stCellInfoReport.u16TempMax = bat_temp_max;")\n'''
          addition = anchor + '''\n# D011 is common-port: normal healthy operation requests both FETs ON.\nrequire(app, "uint8_t chg_target = 1u;")\nrequire(app, "uint8_t dsg_target = 1u;")\nif "dsg_target = d011_switch_is_on()" in app:\n    raise AssertionError("D011 common-port DSG must not be gated by PA0/SW1")\nfet_start = bms.find("static uint8_t sh3510_apply_requested_fets")\nfet_end = bms.find("static void apply_heater", fet_start)\nif fet_start < 0 or fet_end <= fet_start:\n    raise AssertionError("missing FET arbitration function")\nfet_text = bms[fet_start:fet_end]\nrequire(fet_text, "discharge_on = s_requested_discharge_on ? 1u : 0u;")\nif "D011_SWITCH_PIN" in fet_text or "key_on" in fet_text:\n    raise AssertionError("PA0/SW1 must not directly gate common-port CHG/DSG FETs")\n'''
          if anchor not in test:
              raise SystemExit('integration test insertion anchor not found')
          test = test.replace(anchor, addition, 1)
          test_path.write_text(test, encoding='utf-8')
          PY

          python3 tests/sh3673510_d011_integration_check.py
          python3 tests/sh3673520_contract_check.py

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/d011-common-port-mos-fix.yml
          git add tc_ble_single_sdk-V3.4.2.8_Patch_0001/tc_ble_single_sdk/vendor/ble_sample/app.c
          git add tc_ble_single_sdk-V3.4.2.8_Patch_0001/tc_ble_single_sdk/vendor/ble_sample/sh3673510_bms.c
          git add tests/sh3673510_d011_integration_check.py
          git commit -m 'fix: default D011 common-port FETs on'
          git push origin HEAD:feature/sh3673510-d011-bms
