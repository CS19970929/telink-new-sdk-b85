name: Telink BMS CI

on:
  push:
    branches:
      - refactor/bms-template-phase1
      - refactor/d008-bms-phase2
      - refactor/d008-common-bms-features
      - feature/sh3673510-d013-bmsdvc
      - ci-telink-bms-github-actions
  pull_request:
    branches:
      - refactor/bms-template-phase1
      - refactor/d008-bms-phase2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telink-bms-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-contract:
    name: Host contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Show Python version
        run: python --version
      - name: Validate locked source order
        run: python bms_tools/bms.py sources --check
      - name: Run BMS tooling unit tests
        run: python -m unittest tests.test_bms_tools -v
      - name: Run DVC1124 configuration contract check
        run: python tests/dvc1124_config_quick_check.py
      - name: Run D008 framework contract check
        run: python tests/d008_framework_contract_check.py
      - name: Run D008 common-port FET contract check
        run: python tests/d008_common_port_fet_contract_check.py
      - name: Run D008 20S product contract check
        run: python tests/d008_20s_profile_contract_check.py
      - name: Run AFE hardware access contract check
        run: python tests/afe_hw_access_contract_check.py
      - name: AFE MTU23 staged transaction host tests
        run: python tests/afe_hw_fragment_host_check.py
      - name: Execute D008 diagnostics C host tests
        run: python tests/bms_diag_host_check.py
      - name: Run D008 documentation contract check
        run: python tests/d008_documentation_contract_check.py
      - name: Run unified software protection contract check
        run: python tests/sw_protection_contract_check.py
      - name: Execute real software defaults and boot gate checks
        run: |
          python tests/sw_protection_defaults_check.py --series-num 16 --boot-check
          python tests/sw_protection_defaults_check.py --series-num 20 --boot-check
          python tests/sw_protection_defaults_check.py --series-num 24 --boot-check
      - name: Run common heater/balance/open-wire contract check
        run: python tests/common_feature_policy_contract_check.py
      - name: Run independent AFE hardware profile contract check
        run: python tests/afe_hw_profile_contract_check.py
      - name: Run SOC profile/algorithm contract check
        run: python tests/soc_contract_check.py
      - name: Execute independent software temperature groups
        run: python tests/sw_temperature_groups_host_check.py
      - name: Execute recovery wakeup policy
        run: python tests/app_recovery_wakeup_host_check.py
      - name: Execute application scheduler host tests
        run: python tests/app_scheduler_host_check.py
      - name: Execute voltage recovery continuity host tests
        run: python tests/d008_voltage_recovery_host_check.py
      - name: Execute current recovery host tests
        run: python tests/d008_current_recovery_host_check.py
      - name: Execute D008 power and SOC C host tests
        run: python tests/d008_power_soc_host_check.py
      - name: Execute D008 storage transaction C host tests
        run: python tests/d008_storage_host_check.py
      - name: Run Flash storage contract check
        run: python tests/flash_quick_check.py
      - name: Syntax-check Python CI tooling
        run: python -m py_compile bms_tools/bms.py tests/test_bms_tools.py tests/dvc1124_config_quick_check.py tests/d008_framework_contract_check.py tests/d008_common_port_fet_contract_check.py tests/d008_20s_profile_contract_check.py tests/bms_diag_host_check.py tests/d008_documentation_contract_check.py tests/sw_protection_contract_check.py tests/common_feature_policy_contract_check.py tests/afe_hw_profile_contract_check.py tests/afe_hw_access_contract_check.py tests/soc_contract_check.py tests/flash_quick_check.py tests/d008_power_soc_host_check.py tests/d008_storage_host_check.py

  tc32-production:
    name: TC32 production build
    if: ${{ vars.TELINK_TC32_CI_ENABLED == '1' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, Windows, X64, telink-tc32]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check pinned TC32 environment
        shell: powershell
        run: python bms_tools/bms.py env
      - name: Run BMS tooling unit tests
        shell: powershell
        run: python -m unittest tests.test_bms_tools -v
      - name: Validate locked source order
        shell: powershell
        run: python bms_tools/bms.py sources --check
      - name: Run independent AFE hardware profile contract check
        shell: powershell
        run: python tests/afe_hw_profile_contract_check.py
      - name: Run common heater/balance/open-wire contract check
        shell: powershell
        run: python tests/common_feature_policy_contract_check.py

      # Seven isolated development/test builds, then the default 16S production build below.
      # Protection-isolation variants intentionally do NOT set BMS_PRODUCTION_BUILD.
      - name: Clean build and verify D008 16S/20S protection variants
        if: ${{ github.ref == 'refs/heads/refactor/d008-common-bms-features' }}
        shell: powershell
        run: |
          $out = "tc_ble_single_sdk-V3.4.2.8_Patch_0001/tc_ble_single_sdk/project/tlsr_tc32/B85/825x_ble_sample_cli"
          foreach ($profile in @("16S", "20S")) {
            foreach ($mode in @("11", "10", "01", "00")) {
              if ($profile -eq "16S" -and $mode -eq "11") { continue }
              $env:EXTRA_DEFINES = "-DDVC1124_SW_PROTECT_ENABLE=$($mode[0]) -DDVC1124_HW_PROTECT_ENABLE=$($mode[1])"
              if ($profile -eq "20S") { $env:EXTRA_DEFINES += " -DD008_PRODUCT_PROFILE=D008_PRODUCT_PROFILE_20S_NMC" }
              python bms_tools/bms.py rebuild --jobs 4
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              foreach ($check in @("check-fw", "size", "map", "manifest", "verify")) {
                python bms_tools/bms.py $check
                if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              }
              $dest = "variant-evidence/$profile-$mode"
              New-Item -ItemType Directory -Force -Path $dest | Out-Null
              Copy-Item "$out/825x_ble_sample.bin", "$out/825x_ble_sample.elf", "$out/fw_manifest.json", "$out/gen/825x_ble_sample.map", "$out/gen/build.log" -Destination $dest
            }
          }
          Remove-Item Env:EXTRA_DEFINES

      - name: Select production-safe build profile
        shell: powershell
        run: '"EXTRA_DEFINES=-DBMS_PRODUCTION_BUILD=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'
      - name: Clean rebuild with TC32 (production 16S / protection 1/1)
        shell: powershell
        run: python bms_tools/bms.py rebuild --jobs 4
      - name: Validate Telink firmware image
        shell: powershell
        run: python bms_tools/bms.py check-fw
      - name: Report firmware size
        shell: powershell
        run: python bms_tools/bms.py size
      - name: Analyze MAP file
        shell: powershell
        run: python bms_tools/bms.py map
      - name: Generate firmware manifest
        shell: powershell
        run: python bms_tools/bms.py manifest
      - name: Verify firmware integrity
        shell: powershell
        run: python bms_tools/bms.py verify
      - name: Run cppcheck without machine-specific Excel report
        shell: powershell
        run: python bms_tools/bms.py static --no-report
      - name: Run DVC1124 configuration contract check
        shell: powershell
        run: python tests/dvc1124_config_quick_check.py
      - name: Run D008 framework contract check
        shell: powershell
        run: python tests/d008_framework_contract_check.py
      - name: Run D008 common-port FET contract check
        shell: powershell
        run: python tests/d008_common_port_fet_contract_check.py
      - name: Run D008 20S product contract check
        shell: powershell
        run: python tests/d008_20s_profile_contract_check.py
      - name: Run AFE hardware access contract check
        shell: powershell
        run: python tests/afe_hw_access_contract_check.py
      - name: AFE MTU23 staged transaction host tests
        run: python tests/afe_hw_fragment_host_check.py
      - name: Run D008 documentation contract check
        shell: powershell
        run: python tests/d008_documentation_contract_check.py
      - name: Run unified software protection contract check
        shell: powershell
        run: python tests/sw_protection_contract_check.py
      - name: Run SOC profile/algorithm contract check
        shell: powershell
        run: python tests/soc_contract_check.py
      - name: Run Flash storage contract check
        shell: powershell
        run: python tests/flash_quick_check.py
      - name: Upload firmware and analysis evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telink-bms-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            variant-evidence/**
            tc_ble_single_sdk-V3.4.2.8_Patch_0001/tc_ble_single_sdk/project/tlsr_tc32/B85/825x_ble_sample_cli/825x_ble_sample.bin
            tc_ble_single_sdk-V3.4.2.8_Patch_0001/tc_ble_single_sdk/project/tlsr_tc32/B85/825x_ble_sample_cli/825x_ble_sample.elf
            tc_ble_single_sdk-V3.4.2.8_Patch_0001/tc_ble_single_sdk/project/tlsr_tc32/B85/825x_ble_sample_cli/fw_manifest.json
            tc_ble_single_sdk-V3.4.2.8_Patch_0001/tc_ble_single_sdk/project/tlsr_tc32/B85/825x_ble_sample_cli/gen/825x_ble_sample.map
            tc_ble_single_sdk-V3.4.2.8_Patch_0001/tc_ble_single_sdk/project/tlsr_tc32/B85/825x_ble_sample_cli/gen/825x_ble_sample.lst
            tc_ble_single_sdk-V3.4.2.8_Patch_0001/tc_ble_single_sdk/project/tlsr_tc32/B85/825x_ble_sample_cli/gen/build.log
            tc_ble_single_sdk-V3.4.2.8_Patch_0001/tc_ble_single_sdk/project/tlsr_tc32/B85/825x_ble_sample_cli/static/**
