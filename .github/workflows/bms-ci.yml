name: Telink BMS CI

on:
  push:
    branches: [codex-bms-monorepo, codex-bms-deep-simplification-20261016, 'codex/**', 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telink-bms-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sif-protocol:
    name: D008 双协议真实发送代码回归
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # 独立于产品参数更新包；直接编译真实 SIF TU 和 GPIO 定时器替身。
      - name: A1.3.3 报文与接入状态
        run: python tests/sif_packet_host_check.py
      - name: 锂神 V1.1.1 报文与逐tick波形
        run: python tests/sif_lishen_host_check.py
      - name: 本项目锂神扩展电流故障与逐tick波形
        env:
          BMS_SIF_EXTENDED: '1'
        run: python tests/sif_lishen_host_check.py

  sif-tc32:
    name: D008 双协议 TC32 编译与锂神整包链接
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/telink-semi/telink-dev-tc32@sha256:b624c09e880cfc39d8d034062097b6bfeecab91c816fcc32fccd611eafe8d85a
    env:
      TC32_BIN: /opt/toolchain/tc32/bin
    steps:
      - uses: actions/checkout@v4
      # 只编译两个协议模式的原始 TU；不绕过整包构建的 OTA/保护配置安全门禁。
      - name: 官方 TC32 4.5.1 双协议编译
        shell: sh
        run: |
          set -eu
          sdk="tc_ble_single_sdk-V3.4.2.8_Patch_0001/tc_ble_single_sdk"
          includes="-I. -Ibms/products/d008 -Ibms/products -Ibms/core -Ibms/app -Ibms/platform/telink -Ibms/afe/dvc1124 -I$sdk/project/tlsr_tc32/B85 -I$sdk -I$sdk/vendor/common -I$sdk/common -I$sdk/drivers/B85"
          for protocol in 1 2; do
            echo "TC32 SIF protocol=$protocol"
            "$TC32_BIN/tc32-elf-gcc" -c bms/platform/telink/sif_send.c \
              -o "/tmp/sif_protocol_$protocol.o" \
              -ffunction-sections -fdata-sections -Wall -O2 \
              -fpack-struct -fshort-enums -finline-small-functions \
              -std=gnu99 -fshort-wchar -fms-extensions \
              -D__PROJECT_8258_BLE_SAMPLE__=1 -DCHIP_TYPE=CHIP_TYPE_825x \
              "-DBMS_PRODUCT_SIF_PROTOCOL=$protocol" $includes
            "$TC32_BIN/tc32-elf-size" "/tmp/sif_protocol_$protocol.o"
          done
      - name: 锂神 V1.1.1 生产完整 ELF 链接与资源校验
        shell: sh
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends python3
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # 在独立 CI checkout 中临时选择新协议；不修改设备 OTA 参数包或仓库分支。
          sed -i 's/^#define BMS_PRODUCT_SIF_PROTOCOL BMS_SIF_PROTOCOL_A133$/#define BMS_PRODUCT_SIF_PROTOCOL BMS_SIF_PROTOCOL_LISHEN_V111/' bms/platform/telink/sif_send.h
          grep -Fq '#define BMS_PRODUCT_SIF_PROTOCOL BMS_SIF_PROTOCOL_LISHEN_V111' bms/platform/telink/sif_send.h
          export BMS_BUILD_ROOT=/tmp/bms-lishen-validation
          python3 bms_tools/bms.py --product d008 --production --d008-profile 16s-lfp link --jobs 4
          python3 bms_tools/bms.py --product d008 --production --d008-profile 16s-lfp resources

  host-contract:
    name: Four product host regression and portable core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CC: gcc
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: External test outputs
        run: echo "BMS_TEST_OUTPUT=$RUNNER_TEMP/bms-tests" >> "$GITHUB_ENV"
      - name: Validate all source manifests
        run: python bms_tools/bms.py --all-products sources --check
      - name: Verify published source references
        run: python bms_tools/verify_baselines.py --fetch
      - name: Production C contracts and fault injection
        run: python tests/run_host_regression.py
      - name: Portable library
        run: |
          cmake -S . -B "${{ runner.temp }}/bms-core" -DCMAKE_BUILD_TYPE=Debug
          cmake --build "${{ runner.temp }}/bms-core"
          ctest --test-dir "${{ runner.temp }}/bms-core" --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bms-host-${{ github.sha }}
          retention-days: 90
          path: ${{ runner.temp }}/bms-tests

  host-sanitizers:
    name: 公共核心与新场景 ASan/UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CC: gcc
      BMS_SANITIZE: '1'
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 内存与未定义行为验证（不把旧夹具假称为已插桩）
        run: >-
          python tests/run_host_regression.py --output "${{ runner.temp }}/bms-sanitizers"
          --only protection_scenarios_host_check --only product_configuration_host_check
          --only features_scenarios_host_check --only sh_safety_chain_host_check
          --only d014_safety_loop_host_check
          --only sh_register_scenarios_host_check --only dvc_register_scenarios_host_check
          --only modbus_host_check --only current_calibration_host_check
          --only diagnostics_host_check
          --only storage_host_check
          --only core_contract_check
          --only portable_core_host_check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bms-sanitizers-${{ github.sha }}
          retention-days: 90
          path: ${{ runner.temp }}/bms-sanitizers

  tc32-windows:
    name: Four product TC32 ELF and resource gates
    if: ${{ vars.TELINK_TC32_CI_ENABLED == '1' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, Windows, X64, telink-tc32]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ github.workspace }}/ci-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          # The persistent runner can retain locked files from another branch.
          # Use a fresh checkout while keeping production's clean-tree gate.
          path: ci-${{ github.run_id }}-${{ github.run_attempt }}
      - name: External build outputs
        shell: powershell
        run: '"BMS_BUILD_ROOT=$env:RUNNER_TEMP/bms-build" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'
      - name: Validate source ownership
        shell: powershell
        run: python bms_tools/bms.py --all-products sources --check
      - name: Compile and link all products without BIN
        shell: powershell
        run: python bms_tools/bms.py --all-products --production --d008-profile 16s-lfp link --jobs 4
      - name: ELF resource gates
        shell: powershell
        run: python bms_tools/bms.py --all-products --production --d008-profile 16s-lfp resources
      - name: Static analysis from each actual build configuration
        shell: powershell
        run: python bms_tools/bms.py --all-products --production --d008-profile 16s-lfp static --no-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bms-production-windows-${{ github.sha }}
          retention-days: 14
          # Keep reviewable evidence; objects and verbose disassembly stay on the runner.
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/bms-build/**/*.elf
            ${{ runner.temp }}/bms-build/**/*.map
            ${{ runner.temp }}/bms-build/**/resources.json
            ${{ runner.temp }}/bms-build/**/compile-inputs.json
            ${{ runner.temp }}/bms-build/**/link-completed.json
            ${{ runner.temp }}/bms-build/**/build.log
            ${{ runner.temp }}/bms-build/**/static/**/*.json
            ${{ runner.temp }}/bms-build/**/static/**/*.xml
            ${{ runner.temp }}/bms-build/**/static/**/*.csv
            ${{ runner.temp }}/bms-build/**/static/**/*.log
            ${{ runner.temp }}/bms-build/**/static/**/*.txt
            !${{ runner.temp }}/bms-build/**/static/**/cppcheck-cache-*/**

  tc32-production:
    name: Production ${{ matrix.product }} ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      # Official Telink TC32 GCC 4.5.1, pinned by digest for reproducibility.
      image: ghcr.io/telink-semi/telink-dev-tc32@sha256:b624c09e880cfc39d8d034062097b6bfeecab91c816fcc32fccd611eafe8d85a
    strategy:
      fail-fast: false
      matrix:
        include:
          - {product: d008, profile: 16s-lfp}
          - {product: d008, profile: 20s-nmc}
          - {product: d008, profile: 24s-lfp}
          - {product: d011, profile: none}
          - {product: d013, profile: none}
          - {product: d014, profile: none}
    env:
      TC32_BIN: /opt/toolchain/tc32/bin
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Python and output location
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3
          echo "BMS_BUILD_ROOT=$RUNNER_TEMP/bms-build" >> "$GITHUB_ENV"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Full production ELF and hard resource gates
        env:
          PRODUCT: ${{ matrix.product }}
          PROFILE: ${{ matrix.profile }}
        run: |
          if [ "$PROFILE" = none ]; then
            python3 bms_tools/bms.py --product "$PRODUCT" --production link --jobs 4
          else
            python3 bms_tools/bms.py --product "$PRODUCT" --production --d008-profile "$PROFILE" link --jobs 4
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bms-production-${{ matrix.product }}-${{ matrix.profile }}-${{ github.sha }}
          retention-days: 14
          # Keep reviewable evidence; objects and verbose disassembly stay on the runner.
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/bms-build/**/*.elf
            ${{ runner.temp }}/bms-build/**/*.map
            ${{ runner.temp }}/bms-build/**/resources.json
            ${{ runner.temp }}/bms-build/**/compile-inputs.json
            ${{ runner.temp }}/bms-build/**/link-completed.json
            ${{ runner.temp }}/bms-build/**/build.log
            ${{ runner.temp }}/bms-build/**/static/**/*.json
            ${{ runner.temp }}/bms-build/**/static/**/*.xml
            ${{ runner.temp }}/bms-build/**/static/**/*.csv
            ${{ runner.temp }}/bms-build/**/static/**/*.log
            ${{ runner.temp }}/bms-build/**/static/**/*.txt
            !${{ runner.temp }}/bms-build/**/static/**/cppcheck-cache-*/**
