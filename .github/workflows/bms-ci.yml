name: D008 固件验证

on:
  push:
    branches: [refactor/d008-production]
  pull_request:
    branches: [refactor/d008-production]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: D008 主机回归
        run: python tests/run_host_regression.py
      - name: 可移植核心与 Sanitizer
        run: |
          cmake -S . -B "$RUNNER_TEMP/d008-host" -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build "$RUNNER_TEMP/d008-host" --parallel
          ctest --test-dir "$RUNNER_TEMP/d008-host" --output-on-failure

  tc32:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/telink-semi/telink-dev-tc32@sha256:b624c09e880cfc39d8d034062097b6bfeecab91c816fcc32fccd611eafe8d85a
    strategy:
      fail-fast: false
      matrix:
        profile: [16s-lfp, 20s-nmc, 24s-lfp, 23s-lfp, custom]
    env:
      TC32_BIN: /opt/toolchain/tc32/bin
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: D008 生产链接与资源核对
        env:
          D008_PROFILE: ${{ matrix.profile }}
        run: |
          export BMS_BUILD_ROOT="$RUNNER_TEMP/d008-build"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 bms_tools/bms.py --production --d008-profile "$D008_PROFILE" link --jobs 4
          python3 bms_tools/bms.py --production --d008-profile "$D008_PROFILE" resources
