name: BMS Assistant Android

on:
  push:
    branches:
      - build/bms-android-20260902
    paths:
      - 'android-bms-app/**'
      - '.github/workflows/bms-assistant-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0' || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: android-bms-app
        run: gradle --no-daemon clean assembleDebug lint
      - name: Collect APK
        run: |
          mkdir -p dist
          cp android-bms-app/app/build/outputs/apk/debug/app-debug.apk dist/BmsAssistant-Android.apk
          sha256sum dist/BmsAssistant-Android.apk | tee dist/BmsAssistant-Android.sha256.txt
          unzip -t dist/BmsAssistant-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BmsAssistant-Android
          path: |
            dist/BmsAssistant-Android.apk
            dist/BmsAssistant-Android.sha256.txt
          retention-days: 7
