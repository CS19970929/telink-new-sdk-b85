          expected_tables = {
              'AFE_OCD1V_OCCV': [20,30,40,50,60,70,80,90,100,110,120,130,140,160,180,200],
              'AFE_OCD2V': [30,40,50,60,70,80,90,100,120,140,160,180,200,300,400,500],
              'AFE_SCV': [50,80,110,140,170,200,230,260,290,320,350,400,500,600,800,1000],
              'AFE_OVT_UVT': [100,200,300,400,600,800,1000,2000,3000,4000,6000,8000,10000,20000,30000,40000],
              'AFE_SCT': [0,64,128,192,256,320,384,448,512,576,640,704,768,832,896,960],
