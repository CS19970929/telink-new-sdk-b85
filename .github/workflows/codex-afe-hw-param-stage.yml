    if (result == SH309_AFE_PARAM_RESULT_STORE_ERROR) {
        System_ERROR_UserCallback(ERROR_EEPROM_STORE);
        return modbus_exception_response(addr, func, 0x04u, rsp, rsp_len);
    }
    return -1;
}

