name: codex-afe-hw-param-stage

on:
  push:
    branches:
      - codex-afe-hw-param-stage

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply implementation
        run: |
          python -c "import base64,zlib;open('/tmp/afe_patch.py','wb').write(zlib.decompress(base64.b64decode('')))"
          python /tmp/afe_patch.py

      - name: Verify source order and patch hygiene
        run: |
          python bms_tools/bms.py sources --check
          git diff --check

      - name: Verify SH367309 parameter invariants
        run: |
          python -c "import base64,zlib;open('/tmp/afe_verify.py','wb').write(zlib.decompress(base64.b64decode('')))"
          python /tmp/afe_verify.py

      - name: Commit staged implementation and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tc_ble_single_sdk-V3.4.2.8_Patch_0001/tc_ble_single_sdk/vendor/ble_sample/app.c \
                  tc_ble_single_sdk-V3.4.2.8_Patch_0001/tc_ble_single_sdk/vendor/ble_sample/modbus_rtu.c \
                  tc_ble_single_sdk-V3.4.2.8_Patch_0001/tc_ble_single_sdk/vendor/ble_sample/sh367309_datadeal.c \
                  tc_ble_single_sdk-V3.4.2.8_Patch_0001/tc_ble_single_sdk/vendor/ble_sample/sh367309_datadeal.h \
                  tc_ble_single_sdk-V3.4.2.8_Patch_0001/tc_ble_single_sdk/vendor/ble_sample/bms_cold_kv_store.c \
                  tc_ble_single_sdk-V3.4.2.8_Patch_0001/tc_ble_single_sdk/vendor/ble_sample/bms_cold_kv_store.h
          git commit -m "feat: persist and validate SH367309 hardware protection parameters"
          git rm .github/workflows/codex-afe-hw-param-stage.yml
          git commit -m "chore: remove temporary AFE parameter staging workflow"
          git push origin HEAD:codex-afe-hw-param-stage
