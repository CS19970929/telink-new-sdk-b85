name: Apply D011 Protection Recovery Hardening

on:
  push:
    branches:
      - feature/sh3673510-d011-bms
    paths:
      - tools/apply_d011_protection_recovery.py
      - tools/fix_d011_protection_contract.py
      - .github/workflows/d011-protection-recovery-migration.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feature/sh3673510-d011-bms
          fetch-depth: 0

      - name: Syntax-check migration
        run: |
          python -m py_compile tools/apply_d011_protection_recovery.py
          python -m py_compile tools/fix_d011_protection_contract.py

      - name: Apply protection recovery hardening
        run: |
          python tools/apply_d011_protection_recovery.py
          python tools/fix_d011_protection_contract.py

      - name: Run permanent contracts
        run: |
          python tests/sh3673520_contract_check.py
          python tests/sh3673510_d011_integration_check.py
          python -m py_compile tests/sh3673510_d011_integration_check.py

      - name: Commit source changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tc_ble_single_sdk-V3.4.2.8_Patch_0001/tc_ble_single_sdk/vendor/ble_sample/sh3673510_bms.c \
            tc_ble_single_sdk-V3.4.2.8_Patch_0001/tc_ble_single_sdk/vendor/ble_sample/sh3673510_project_config.h \
            tests/sh3673510_d011_integration_check.py \
            docs/SH36735XX_AFE_REGISTER_CONFIG.md
          git commit -m "fix: harden D011 protection recovery and heater safety"
          git push origin HEAD:feature/sh3673510-d011-bms
