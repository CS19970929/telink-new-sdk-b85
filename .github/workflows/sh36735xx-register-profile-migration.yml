name: Apply SH36735xx Register Profile

on:
  push:
    branches:
      - feature/sh3673510-d011-bms
    paths:
      - tools/apply_sh36735xx_register_profile.py
      - .github/workflows/sh36735xx-register-profile-migration.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feature/sh3673510-d011-bms
          fetch-depth: 0

      - name: Apply register profile refactor
        run: python tools/apply_sh36735xx_register_profile.py

      - name: Run contracts
        run: |
          python tests/sh3673520_contract_check.py
          python tests/sh3673510_d011_integration_check.py
          python -m py_compile tools/apply_sh36735xx_register_profile.py tests/sh3673510_d011_integration_check.py

      - name: Commit source changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tc_ble_single_sdk-V3.4.2.8_Patch_0001/tc_ble_single_sdk/vendor/ble_sample/sh3673510_control.c tests/sh3673510_d011_integration_check.py
          git commit -m "refactor: apply explicit D011 AFE register profile"
          git push origin HEAD:feature/sh3673510-d011-bms
