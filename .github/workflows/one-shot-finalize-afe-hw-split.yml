name: One-shot finalize AFE hardware split

on:
  push:
    branches:
      - refactor/d013-afe-hw-protection-split
    paths:
      - tools/finalize_afe_hw_split.py
      - tests/afe_hw_profile_contract_check.py
      - .github/workflows/one-shot-finalize-afe-hw-split.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Seed AFE access source order
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('bms_tools/source_order.txt')
          s=p.read_text(encoding='utf-8')
          entry='vendor/ble_sample/bms_afe_hw_access.c\n'
          if entry not in s:
              anchor='vendor/ble_sample/bms_afe_hw_profile.c\n'
              if anchor not in s: raise SystemExit('source-order profile anchor missing')
              s=s.replace(anchor,entry+anchor,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Apply final split architecture
        run: python tools/finalize_afe_hw_split.py
      - name: Refresh source order
        run: python bms_tools/bms.py sources --update
      - name: Run contracts
        run: |
          python bms_tools/bms.py sources --check
          python tests/afe_hw_profile_contract_check.py
          python tests/afe_hw_access_contract_check.py
          python tests/sh3673520_contract_check.py
          python tests/sh3673510_d011_integration_check.py
          python tests/sh3673510_protection_mode_check.py
          python tests/sh3673510_temperature_encoding_check.py
          python tests/sw_protection_contract_check.py
          python tests/soc_contract_check.py
          python tests/flash_quick_check.py
      - name: Commit final firmware split
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(bms): finalize independent AFE hardware protection transactions"
          git push origin HEAD:${GITHUB_REF_NAME}
