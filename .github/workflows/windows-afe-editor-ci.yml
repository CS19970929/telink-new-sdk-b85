name: BMS client main CI

on:
  push:
    branches: [client/main]
    paths:
      - 'bms-tool-windows/**'
      - 'firmware/comm_tool_f103ret6/**'
      - 'tools/comm-tool/**'
      - 'docs/comm-tool/**'
      - 'AGENTS.md'
      - '.github/workflows/windows-afe-editor-ci.yml'
  pull_request:
    branches: [client/main]
    paths:
      - 'bms-tool-windows/**'
      - 'firmware/comm_tool_f103ret6/**'
      - 'tools/comm-tool/**'
      - 'docs/comm-tool/**'
      - '.github/workflows/windows-afe-editor-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      BMS_BUILD_ROOT: ${{ runner.temp }}/bms-client/build
      BMS_PUBLISH_ROOT: ${{ runner.temp }}/bms-client/publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build customer, internal and CLI
        shell: pwsh
        run: |
          foreach ($project in @('BmsTool.Windows','BmsFactoryTest.Windows','BmsTool.Cli')) {
            dotnet build "bms-tool-windows/$project/$project.csproj" -c Release --artifacts-path $env:BMS_BUILD_ROOT -p:NuGetAudit=false
            if ($LASTEXITCODE -ne 0) { throw "$project build failed" }
          }
      - name: Shared protocol and compatibility regressions
        shell: pwsh
        run: |
          foreach ($script in @('test-ota-protocol.ps1','test-diagnostics.ps1','test-afe-fragments.ps1','test-afe-registers.ps1','test-soc-hil-protocol.ps1','test-ble-discovery.ps1','test-c077-compatibility.ps1','test-c11-client.ps1','test-serial-upgrade.ps1','test-owc-protocol.ps1')) {
            & (Join-Path bms-tool-windows $script)
            if ($LASTEXITCODE -ne 0) { throw "$script failed" }
          }
      - name: Actual desktop assemblies and CLI offline checks
        shell: pwsh
        run: |
          $customer = Join-Path $env:BMS_BUILD_ROOT 'bin/BmsTool.Windows/release/BmsTool.Windows.dll'
          $internal = Join-Path $env:BMS_BUILD_ROOT 'bin/BmsFactoryTest.Windows/release/BmsFactoryTest.Windows.dll'
          foreach ($script in @('test-client-lifecycle.ps1','test-main-window-experience.ps1','test-afe-editor-ui.ps1','test-afe-write-compatibility.ps1','test-business-parameters-ui.ps1','test-owc-ui.ps1')) {
            & (Join-Path bms-tool-windows $script) -CustomerAssembly $customer -InternalAssembly $internal
            if ($LASTEXITCODE -ne 0) { throw "$script failed" }
          }
          & bms-tool-windows/test-cli-offline.ps1 -CliDll (Join-Path $env:BMS_BUILD_ROOT 'bin/BmsTool.Cli/release/bms-cli.dll')
          if ($LASTEXITCODE -ne 0) { throw 'CLI offline failed' }
      - name: Comm Tool production decoder and maintenance compatibility
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONIOENCODING: utf-8
          PIP_CACHE_DIR: ${{ runner.temp }}/bms-client/pip
        run: |
          python -m pip install pyserial
          if ($LASTEXITCODE -ne 0) { throw 'pyserial install failed' }
          foreach ($script in @('check_comm_tool_keil.py','check_comm_tool_owc_snapshot.py','check_comm_tool_owc.py','check_comm_tool_owc_dual.py','check_comm_tool_owc_dual_host.py','check_comm_tool_upgrade_boundaries.py')) {
            python -B "tools/comm-tool/$script"
            if ($LASTEXITCODE -ne 0) { throw "$script failed" }
          }
      - name: Publish Windows tools
        shell: pwsh
        run: |
          foreach ($entry in @(@{Project='BmsTool.Windows';Folder='customer'},@{Project='BmsFactoryTest.Windows';Folder='internal'},@{Project='BmsTool.Cli';Folder='cli'})) {
            dotnet publish "bms-tool-windows/$($entry.Project)/$($entry.Project).csproj" -c Release -r win-x64 --self-contained false --artifacts-path $env:BMS_BUILD_ROOT -o (Join-Path $env:BMS_PUBLISH_ROOT $entry.Folder) -p:NuGetAudit=false
            if ($LASTEXITCODE -ne 0) { throw "$($entry.Project) publish failed" }
          }
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Bms-Client-${{ github.sha }}
          path: ${{ env.BMS_PUBLISH_ROOT }}/**
          retention-days: 14
