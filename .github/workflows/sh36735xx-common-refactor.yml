# One-shot migration workflow. Remove after the common-driver refactor is committed.
name: Apply SH36735xx Common Refactor

on:
  push:
    branches:
      - feature/sh3673510-d011-bms
    paths:
      - tools/refactor_sh36735xx_common.py
      - .github/workflows/sh36735xx-common-refactor.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feature/sh3673510-d011-bms
          fetch-depth: 0

      - name: Apply refactor
        run: python tools/refactor_sh36735xx_common.py

      - name: Run contracts
        run: |
          python tests/sh3673520_contract_check.py
          python tests/sh3673510_d011_integration_check.py
          python -m py_compile tools/refactor_sh36735xx_common.py tests/sh3673510_d011_integration_check.py

      - name: Commit source changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: simplify SH36735xx common SPI driver"
          git push origin HEAD:feature/sh3673510-d011-bms
