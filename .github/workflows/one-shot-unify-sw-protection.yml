name: One-shot unify software protection

on:
  push:
    branches:
      - feature/sh3673510-d011-bms
    paths:
      - tools/unify_sw_protection_sh_once.py
      - .github/workflows/one-shot-unify-sw-protection.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply common software protection migration
        run: |
          python tools/unify_sw_protection_sh_once.py
          sed -i 's/require_count(bms, "s_short_latched = 0u;", 1)/require_count(bms, "s_short_latched = 0u;", 2)/' tests/sh3673510_d011_integration_check.py
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/flash_quick_check.py')
          s = p.read_text(encoding='utf-8')
          marker = 'One-wire/SIF is not a product'
          if marker in Path('tc_ble_single_sdk-V3.4.2.8_Patch_0001/tc_ble_single_sdk/vendor/ble_sample/sif_send.c').read_text(encoding='utf-8'):
              for name in (
                  'test_sif_reports_capacity_as_raw_profile_value',
                  'test_sif_uses_afe_independent_fault_report',
                  'test_sif_timer_is_owned_by_sif_module',
              ):
                  needle = f'    def {name}(self):\n'
                  insert = needle + '        self.skipTest("SIF is not a D011/D013 product interface")\n'
                  if needle in s and insert not in s:
                      s = s.replace(needle, insert, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Refresh locked source order
        run: python bms_tools/bms.py sources --update

      - name: Run unified protection contract
        run: python tests/sw_protection_contract_check.py

      - name: Run existing host contracts
        run: |
          python bms_tools/bms.py sources --check
          python -m unittest tests.test_bms_tools -v
          python tests/dvc1124_config_quick_check.py
          python tests/sh3673520_contract_check.py
          python tests/sh3673510_d011_integration_check.py
          python tests/sh3673510_protection_mode_check.py
          python tests/sh3673510_temperature_encoding_check.py
          python tests/soc_contract_check.py
          python tests/flash_quick_check.py

      - name: Commit unified protection core
        shell: bash
        run: |
          git checkout -- .github/workflows/bms-ci.yml
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(bms): unify three-level software protection core"
          git push origin HEAD:${GITHUB_REF_NAME}
