name: SOC Productization

on:
  push:
    branches:
      - feature/sh3673510-d011-bms

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix temporary migration extraction
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/productize_soc_profile.py')
          t = p.read_text(encoding='utf-8')
          start = t.index('# Remove profile data from the algorithm source.')
          end = t.index('\nc = replace_once(', start)
          replacement = '''# Remove profile data from the algorithm source while preserving runtime enums/state.\nprofile_types_start = c.index("typedef struct\\n{\\n    uint16_t mv;\\n    uint8_t soc;\\n} soc_ocv_point_t;")\nprofile_types_end = c.index("typedef enum\\n{\\n    SOC_INTEGRAL_DIR_NONE", profile_types_start)\nc = c[:profile_types_start] + c[profile_types_end:]\nprofile_data_start = c.index("static const soc_ocv_point_t g_soc_ocv_lfp[]")\nprofile_data_end = c.index("struct SOC_CALCULATE_ELEMENT", profile_data_start)\nc = c[:profile_data_start] + c[profile_data_end:]\n'''
          p.write_text(t[:start] + replacement + t[end:], encoding='utf-8')
          PY

      - name: Apply SOC product config/profile refactor
        run: python tools/productize_soc_profile.py

      - name: Align Flash contract with separated profile data
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/flash_quick_check.py')
          t = p.read_text(encoding='utf-8')
          old = '''    def test_soc_core_contracts_match_current_design(self):\n        text = read_text(SOC_ENHANCE_C)\n        self.assertIn("#define SOC_EQUIV_CYCLE_PERCENT             100u", text)\n        self.assertIn("#define SOC_INTEGRAL_PERIOD_MS              200u", text)\n        self.assertIn("#define SOC_CURRENT_DEADBAND_MA_DEFAULT     200u", text)\n        self.assertIn("#define SOC_OCV_REST_PREPARE_SECONDS        600u", text)\n        self.assertIn("#define SOC_OCV_ERROR_BAND_PERCENT          5u", text)\n        self.assertIn("static const soc_ocv_point_t g_soc_ocv_lfp[]", text)\n        self.assertIn("static const soc_ocv_point_t g_soc_ocv_nmc[]", text)\n        self.assertIn("return soc_step_down_to(g_soc_runtime.ocv_high);", text)\n        self.assertIn("static uint8_t g_soc_display_soc", text)\n        self.assertIn("g_stCellInfoReport.SocElement.u16Soc = get_soc_display();", text)\n        self.assertIn("soc_update_low_faults();", text)\n'''
          new = '''    def test_soc_core_contracts_match_current_design(self):\n        text = read_text(SOC_ENHANCE_C)\n        profile = read_text(MODULE_DIR / "bms_soc_profile.h")\n        self.assertIn("#define SOC_EQUIV_CYCLE_PERCENT             100u", text)\n        self.assertIn("#define SOC_INTEGRAL_PERIOD_MS              200u", text)\n        self.assertIn("#define SOC_CURRENT_DEADBAND_MA_DEFAULT     200u", text)\n        self.assertIn("#define SOC_OCV_REST_PREPARE_SECONDS        600u", text)\n        self.assertIn("#define SOC_OCV_ERROR_BAND_PERCENT          5u", text)\n        self.assertIn("static const soc_ocv_point_t g_soc_ocv_lfp[]", profile)\n        self.assertIn("static const soc_ocv_point_t g_soc_ocv_nmc[]", profile)\n        self.assertNotIn("static const soc_ocv_point_t g_soc_ocv_lfp[]", text)\n        self.assertIn("return soc_step_down_to(g_soc_runtime.ocv_high);", text)\n        self.assertIn("static uint8_t g_soc_display_soc", text)\n        self.assertIn("g_stCellInfoReport.SocElement.u16Soc = get_soc_display();", text)\n        self.assertIn("soc_update_low_faults();", text)\n'''
          if t.count(old) != 1:
              raise SystemExit(f'flash SOC contract block count={t.count(old)}')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Run SOC contract
        run: python tests/soc_contract_check.py

      - name: Run Flash contract
        run: python tests/flash_quick_check.py

      - name: Validate source order
        run: python bms_tools/bms.py sources --check

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tc_ble_single_sdk-V3.4.2.8_Patch_0001/tc_ble_single_sdk/vendor/ble_sample/SocEnhance.c \
                  tc_ble_single_sdk-V3.4.2.8_Patch_0001/tc_ble_single_sdk/vendor/ble_sample/SocEnhance.h \
                  tc_ble_single_sdk-V3.4.2.8_Patch_0001/tc_ble_single_sdk/vendor/ble_sample/bms_cold_kv_store.c \
                  tc_ble_single_sdk-V3.4.2.8_Patch_0001/tc_ble_single_sdk/vendor/ble_sample/bms_cold_kv_store.h \
                  tc_ble_single_sdk-V3.4.2.8_Patch_0001/tc_ble_single_sdk/vendor/ble_sample/bms_soc_defs.h \
                  tc_ble_single_sdk-V3.4.2.8_Patch_0001/tc_ble_single_sdk/vendor/ble_sample/bms_soc_profile.h \
                  tests/soc_contract_check.py tests/flash_quick_check.py docs/SOC.md docs/STORAGE.md
          git diff --cached --check
          git commit -m "feat: persist SOC chemistry and profile selection"
          git push origin HEAD:${GITHUB_REF_NAME}
