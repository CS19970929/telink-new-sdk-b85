; bms_tools/static_analysis/cppcheck.cfg
; -----------------------------------------------------------------------------
; cppcheck configuration for the TLSR8251 BMS project.
;
; Scope:
;   * vendor/ble_sample          -> project BMS application code (PRIMARY)
;   * vendor/common             -> Telink SDK vendor sample code
;   * drivers/B85                -> Telink B85 (TLSR825x) driver sources
;   * common                     -> Telink SDK common sources
;
; The SDK vendor code is treated as TRUSTED input (do not fix warnings there
; without an explicit Telink SDK update). Project code (vendor/ble_sample)
; findings must be evaluated and either fixed or documented with a justified
; suppression inline (`// cppcheck-suppress <id>` with a reason).
;
; IMPORTANT: cppcheck does NOT provide a full MISRA-C:2012 compliance check.
; We enable the project-style checks below as a repeatable code review baseline.
; Do NOT claim MISRA compliance from these results alone.
; -----------------------------------------------------------------------------

--enable=warning,style,performance,portability,unusedFunction
--suppress=missingIncludeSystem
--suppress=noExplicitConstructor:vendor/common/*
--suppress=noExplicitConstructor:drivers/B85/*
--suppress=unreadVariable:drivers/B85/*
--inline-suppr
--quiet
--std=c99

; Known SDK-specific deviations that are part of the Telink SDK contract and
; not in scope for routine project-code review:
;   - heavy use of macros and bit-field access in drivers/B85 (vendor contract)
;   - register-map unions with overlaid storage (intentional hardware access)
--suppress=invalidPointerCast:drivers/B85/*
--suppress=invalidPointerCast:vendor/common/tlkapi_debug.c
--suppress=reinterpretCast:drivers/B85/*
