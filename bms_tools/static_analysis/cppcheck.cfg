; Cppcheck policy for the TLSR8251 BMS application analysis.
;
; Source files, -I, -D and the real gnu99 compile command are NOT maintained
; here. bms.py derives them from build.mk + source_order.txt with make -B -n
; and passes a filtered compile_commands.json to Cppcheck.
;
; Application finding suppression is not enabled and inline suppressions are
; not honored. bms.py generates a per-run scope exclusion list for official
; SDK/toolchain dependencies outside vendor/ble_sample. Those headers are
; still parsed for real types/macros but their diagnostics are not in scope.
; Native Cppcheck diagnostics remain distinct from MISRA addon diagnostics.

--enable=warning,style,performance,portability,unusedFunction,information
--inconclusive
--check-level=exhaustive
--std=c99
--language=c
--quiet
